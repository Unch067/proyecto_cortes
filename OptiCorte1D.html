<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>OptiCorte 1D - Grupo 03</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.75.0/build/stlite.css" />
    <style>
      html, body {
        background-color: #0e1117;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.75.0/build/stlite.js"></script>
    <script>
      const BASE_URL = "https://raw.githubusercontent.com/Unch067/proyecto_cortes/main";

      stlite.mount(
        {
          requirements: ["pandas", "plotly"],
          entrypoint: "app.py",
          files: {
            ".streamlit/config.toml": '[theme]\nbase = "dark"\n',
            "app.py": { url: `${BASE_URL}/app.py?v=3` },
            "core/__init__.py": "",
            "core/optimizador.py": { url: `${BASE_URL}/core/optimizador.py?v=3` },
            "components/__init__.py": "",
            "components/validaciones.py": { url: `${BASE_URL}/components/validaciones.py?v=3` },
            "components/graficos.py": { url: `${BASE_URL}/components/graficos.py?v=3` }
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
